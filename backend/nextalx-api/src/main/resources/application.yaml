spring:
  application:
    name: nextalx-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextalx}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgre}

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Serverless Postgres (Neon) suspends its compute when no client is connected.
      # Holding an idle connection open would pin it awake and burn the monthly
      # CU-hour allowance, so let the pool drain all the way to zero between requests.
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Finish in-flight requests before shutting down (clean redeploys).
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  # Optional API key. Leave empty to keep the API open (default). When set,
  # requests to /api/v1/** must send a matching X-API-Key header.
  api-key: ${API_KEY:}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
